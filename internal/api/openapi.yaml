openapi: 3.1.0
info:
  title: Kryton API
  version: 1.1.0
  description: |
    Kryton Windows virtualization control plane. All machine operations are project-scoped.
    Authenticate with `Authorization: Bearer <token>` (apikey mode) or trusted proxy headers.
    OpenAPI is served at `/openapi.yaml` and discovery at `GET /api/v1`.
  contact:
    name: Zyvor
    url: https://zyvor.dev
  license:
    name: Apache-2.0
servers:
  - url: /
    description: Relative to Kryton base URL
security:
  - bearerAuth: []
tags:
  - name: meta
  - name: machines
  - name: storage
  - name: settings
  - name: images
  - name: jobs
  - name: guest
    description: dockur guest management - readiness, restart, shared folder, script jobs
  - name: events
  - name: health
paths:
  /api/v1:
    get:
      tags: [meta]
      summary: API discovery catalog
      security: []
      responses:
        '200':
          description: Machine-readable list of endpoints and auth modes
  /api/v1/me:
    get:
      tags: [meta]
      summary: Current identity
      responses:
        '200': {description: Authenticated principal}
  /api/v1/projects:
    get:
      tags: [meta]
      summary: Accessible projects
      responses:
        '200': {description: Project list}
  /api/v1/capabilities:
    get:
      tags: [meta]
      summary: Provider capabilities
      responses:
        '200': {description: Capability flags}
  /api/v1/doctor:
    get:
      tags: [meta]
      summary: Environment diagnostics
      responses:
        '200': {description: Healthy}
        '503': {description: One or more checks failed}
  /api/v1/settings:
    get:
      tags: [settings]
      summary: Runtime and system settings
      responses:
        '200': {description: Settings view}
    put:
      tags: [settings]
      summary: Update runtime settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200': {description: Updated settings}
        '400': {description: Invalid request}
        '403': {description: Forbidden}
  /api/v1/settings/test:
    post:
      tags: [settings]
      summary: Test control-plane connectivity
      responses:
        '200': {description: All probes passed}
        '503': {description: One or more probes failed}
  /api/v1/integrations/atlas/test:
    post:
      tags: [integrations]
      summary: Test Atlas storage control plane integration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasConfig'
      responses:
        '200': {description: Atlas reachable}
        '503': {description: Atlas probes failed}
  /api/v1/storage:
    get:
      tags: [storage]
      summary: Cluster StorageClasses and VolumeSnapshotClasses
      responses:
        '200': {description: Storage inventory}
  /api/v1/storage/config:
    get:
      tags: [storage]
      summary: Active default StorageClass
      responses:
        '200': {description: Storage config}
    put:
      tags: [storage]
      summary: Set default StorageClass for new VM disks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storageClass: {type: string, example: rook-ceph-block}
      responses:
        '200': {description: Updated}
        '400': {description: Invalid class}
  /api/v1/storage/setup:
    get:
      tags: [storage]
      summary: Storage install job status and logs
      responses:
        '200': {description: Setup status}
    post:
      tags: [storage]
      summary: Install Longhorn or Rook Ceph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageSetup'
      responses:
        '202': {description: Setup started}
        '400': {description: Invalid request}
  /api/v1/images:
    get:
      tags: [images]
      summary: Image catalog
      responses:
        '200': {description: Images}
  /api/v1/golden:
    get:
      tags: [images]
      summary: Golden image builds
      responses:
        '200': {description: Builds}
    post:
      tags: [images]
      summary: Start golden image build
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                imageId: {type: string}
                version: {type: string}
                auto: {type: boolean}
      responses:
        '202': {description: Build started}
  /api/v1/golden/{id}:
    get:
      tags: [images]
      parameters:
        - $ref: '#/components/parameters/GoldenID'
      responses:
        '200': {description: Build}
        '404': {description: Not found}
  /api/v1/golden/{id}/passport:
    get:
      tags: [images]
      summary: guestkit Cutover Passport (boot/migration evidence) for this build
      parameters:
        - $ref: '#/components/parameters/GoldenID'
      responses:
        '200': {description: Passport JSON}
        '404': {description: No passport recorded for this build}
  /api/v1/golden/{id}/bootstrap:
    post:
      tags: [images]
      parameters:
        - $ref: '#/components/parameters/GoldenID'
      responses:
        '202': {description: CDI bootstrap started}
        '400': {description: Build not ready}
  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: Active and recent jobs
      responses:
        '200': {description: Jobs}
  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Job}
        '404': {description: Not found}
  /api/v1/summary:
    get:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Project summary}
  /api/v1/machines:
    get:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/Project'
        - in: query
          name: limit
          description: Max items per page (1-500).
          schema: {type: integer, default: 50}
        - in: query
          name: cursor
          description: Opaque page cursor from a previous response's nextCursor.
          schema: {type: string}
      responses:
        '200': {description: Machines}
    post:
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachine'
      responses:
        '201': {description: Machine created}
        '400': {description: Invalid request}
        '409': {description: Name conflict}
  /api/v1/machines/{id}:
    parameters:
      - $ref: '#/components/parameters/MachineID'
      - $ref: '#/components/parameters/Project'
    get:
      tags: [machines]
      responses:
        '200': {description: Machine}
        '404': {description: Not found}
    delete:
      tags: [machines]
      responses:
        '204': {description: Deleted}
  /api/v1/machines/{id}/start:
    post:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Start requested}
  /api/v1/machines/{id}/stop:
    post:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Stop requested}
  /api/v1/machines/{id}/restart:
    post:
      tags: [guest]
      summary: Restart the guest (dockur only)
      description: |
        Graceful by default: `compose stop -t 120` (dockur turns SIGTERM into an ACPI power-button
        press and waits for Windows to shut down), then `compose start`. `force` kills the container
        instead. With `wait` (default true) the call blocks until RDP answers (and the guest agent
        heartbeat is present for `jobAgent` machines) or `timeoutSeconds` (default 300, max 1800).
        Returns 200 when ready, 202 when not (yet).
        Emits `io.kryton.machine.restarted` and, when ready, `io.kryton.machine.ready`. Requires Operator.
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force: {type: boolean}
                wait: {type: boolean, default: true}
                timeoutSeconds: {type: integer, minimum: 1, maximum: 1800}
      responses:
        '200': {description: "Restarted and ready; body is an object with machine and readiness"}
        '202': {description: Restarted; guest not ready yet}
        '501': {description: Provider has no guest management}
  /api/v1/machines/{id}/ready:
    get:
      tags: [guest]
      summary: Readiness probe (dockur only)
      description: |
        200 when the container is running, RDP answers an X.224 negotiation, and (for `jobAgent`
        machines) the guest agent heartbeat `.kryton/agent-ready` is fresh; 503 with the same body
        otherwise. While not ready, `install` carries a best-effort phase/percent parsed from dockur's
        container log. `wait=true` long-polls up to `timeoutSeconds` (default 120, max 900).
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: query, name: wait, schema: {type: boolean}}
        - {in: query, name: timeoutSeconds, schema: {type: integer, minimum: 1, maximum: 900}}
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}}
        '503': {description: Not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Readiness'}}}}
  /api/v1/machines/{id}/logs:
    get:
      tags: [guest]
      summary: dockur container log tail (Operator)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: query, name: tail, schema: {type: integer, minimum: 1, maximum: 2000, default: 200}}
      responses:
        '200': {description: Plain-text log, content: {text/plain: {schema: {type: string}}}}
  /api/v1/machines/{id}/shared:
    get:
      tags: [guest]
      summary: List a shared-folder directory (non-recursive)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: query, name: path, schema: {type: string}, description: Directory relative to the shared folder root}
      responses:
        '200': {description: Entries, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/SharedFile'}}}}}}}
        '409': {description: Machine was created without dockur.shared}
  /api/v1/machines/{id}/shared/{path}:
    parameters:
      - $ref: '#/components/parameters/MachineID'
      - $ref: '#/components/parameters/Project'
      - {in: path, name: path, required: true, schema: {type: string}, description: "Relative path; no .., backslashes, drive letters or the reserved .kryton directory. Symbolic links are never followed."}
    get:
      tags: [guest]
      summary: Download a shared file (served as attachment, application/octet-stream)
      responses:
        '200': {description: File bytes (Range supported)}
        '400': {description: Invalid path}
        '404': {description: Not found}
    put:
      tags: [guest]
      summary: Upload a shared file (raw request body; Operator)
      description: Parent directories are created. Fails with 409 if the file exists unless `overwrite=true`; 413 beyond KRYTON_DOCKUR_MAX_UPLOAD_MIB (default 1024 MiB).
      parameters:
        - {in: query, name: overwrite, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          application/octet-stream: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/SharedFile'}}}}
        '400': {description: Invalid path}
        '409': {description: Exists}
        '413': {description: Too large}
    delete:
      tags: [guest]
      summary: Delete a shared file or empty directory (Operator)
      responses:
        '204': {description: Deleted}
        '404': {description: Not found}
  /api/v1/machines/{id}/jobs:
    post:
      tags: [guest]
      summary: Submit a script to run in the guest (Operator)
      description: |
        Needs a machine created with `dockur.jobAgent: true`, which installs a PowerShell agent through
        the OEM first-boot script. The agent polls the shared folder, so jobs are picked up once the
        guest is logged in. Emits `io.kryton.machine.job.submitted` and `io.kryton.machine.job.completed`
        (data: project, machineId, jobId, state, exitCode, durationSeconds).
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuestJobSpec'}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/GuestJob'}}}}
        '400': {description: Invalid job}
        '409': {description: Machine has no job agent}
    get:
      tags: [guest]
      summary: List guest jobs (newest first, max 200)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Jobs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/GuestJob'}}}}}}}
  /api/v1/machines/{id}/jobs/{jid}:
    get:
      tags: [guest]
      summary: Get a guest job (state, exit code, artifacts)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: path, name: jid, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/GuestJob'}}}}
        '404': {description: Unknown job}
  /api/v1/machines/{id}/jobs/{jid}/cancel:
    post:
      tags: [guest]
      summary: Cancel a guest job (Operator)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: path, name: jid, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Job (canceled at once if not started, otherwise cancel requested)}
  /api/v1/machines/{id}/jobs/{jid}/logs:
    get:
      tags: [guest]
      summary: Job stdout+stderr window
      description: Headers `X-Log-Size` (total bytes) and `X-Log-Next-Offset` support incremental polling. At most 4 MiB per call.
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: path, name: jid, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Raw bytes, content: {text/plain: {schema: {type: string}}}}
  /api/v1/machines/{id}/jobs/{jid}/artifacts:
    get:
      tags: [guest]
      summary: List files the job wrote to $env:KRYTON_ARTIFACTS
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: path, name: jid, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Artifacts, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/SharedFile'}}}}}}}
  /api/v1/machines/{id}/jobs/{jid}/artifacts/{path}:
    get:
      tags: [guest]
      summary: Download one artifact
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
        - {in: path, name: jid, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: path, required: true, schema: {type: string}}
      responses:
        '200': {description: File bytes}
        '404': {description: Not found}
  /api/v1/machines/{id}/snapshot:
    post:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        '201': {description: Snapshot requested}
  /api/v1/machines/{id}/snapshots:
    get:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Snapshot list}
  /api/v1/machines/{id}/snapshots/{sid}/restore:
    post:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/SnapshotID'
        - $ref: '#/components/parameters/Project'
      responses:
        '202': {description: Restore requested}
  /api/v1/machines/{id}/snapshots/{sid}:
    delete:
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/SnapshotID'
        - $ref: '#/components/parameters/Project'
      responses:
        '204': {description: Snapshot deleted}
  /api/v1/machines/{id}/console:
    get:
      tags: [machines]
      summary: Web console (provider-dependent)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: Console HTML or redirect}
  /api/v1/machines/{id}/console-ticket:
    post:
      tags: [machines]
      summary: Mint a short-lived console ticket
      description: >-
        Returns a 10-minute ticket (and sets an equivalent HttpOnly cookie scoped to
        /api/v1/machines/{id}/) that authorizes GET requests to this machine's
        /console and /vnc endpoints with viewer rights, for iframes, new tabs and
        websockets that cannot send an Authorization header. Pass it as
        ?console_ticket=.
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: '{"ticket": string, "expiresAt": date-time}'}
  /api/v1/machines/{id}/vnc:
    get:
      tags: [machines]
      summary: VNC websocket/proxy (KubeVirt)
      parameters:
        - $ref: '#/components/parameters/MachineID'
        - $ref: '#/components/parameters/Project'
      responses:
        '200': {description: VNC stream}
  /api/v1/events:
    get:
      tags: [events]
      parameters:
        - in: query
          name: limit
          schema: {type: integer, default: 100}
      responses:
        '200': {description: CloudEvent history}
  /api/v1/events/stream:
    get:
      tags: [events]
      summary: Server-sent CloudEvent stream
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}
  /healthz:
    get:
      tags: [health]
      security: []
      responses:
        '200': {description: Liveness}
  /readyz:
    get:
      tags: [health]
      security: []
      responses:
        '200': {description: Readiness}
  /metrics:
    get:
      tags: [health]
      security: []
      responses:
        '200': {description: Prometheus metrics}
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: OpenAPI 3.1 specification
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from KRYTON_API_KEYS_FILE (hash with krytonctl hash-token)
  parameters:
    Project:
      in: query
      name: project
      schema: {type: string}
      description: Project scope (defaults to identity default when omitted on some routes)
    MachineID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    SnapshotID:
      in: path
      name: sid
      required: true
      schema: {type: string}
    GoldenID:
      in: path
      name: id
      required: true
      schema: {type: string}
  schemas:
    CreateMachine:
      type: object
      required: [project, name, image, compute, disk]
      properties:
        project: {type: string}
        name: {type: string}
        image: {type: string}
        compute:
          type: object
          required: [cpu, memoryMiB]
          properties:
            cpu: {type: integer, minimum: 1, maximum: 256}
            memoryMiB: {type: integer, minimum: 512}
        disk:
          type: object
          required: [sizeGiB]
          properties:
            sizeGiB: {type: integer, minimum: 16}
            storageClass: {type: string, description: Override Settings default (e.g. rook-ceph-block)}
        network:
          type: object
          properties:
            networkId: {type: string}
        ttlMinutes: {type: integer, minimum: 0, maximum: 43200}
        initialization:
          $ref: "#/components/schemas/LinuxInitialization"
        dockur:
          $ref: '#/components/schemas/DockurOptions'
    LinuxInitialization:
      type: object
      additionalProperties: false
      properties:
        username: {type: string, pattern: "^[a-z_][a-z0-9_-]{0,31}$"}
        sshAuthorizedKeys:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 16384}
    DockurOptions:
      type: object
      description: dockur/windows create options (provider=dockur only). Password is write-only.
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, maxLength: 128, writeOnly: true}
        hostname: {type: string, maxLength: 63}
        language: {type: string}
        region: {type: string}
        keyboard: {type: string}
        productKey: {type: string, maxLength: 64}
        domain: {type: string}
        domainOu: {type: string}
        autologin: {type: boolean}
        audio: {type: boolean}
        secureBoot: {type: boolean}
        sharedDir:
          type: string
          deprecated: true
          description: Legacy. Single directory name under the machine directory (never a host path; absolute paths and `..` are rejected). Prefer `shared`.
        oemDir:
          type: string
          deprecated: true
          description: Legacy. Single directory name under the machine directory. Prefer `oemScript`.
        shared:
          type: boolean
          description: Mount <machineDir>/shared at /shared (guest `\\host.lan\Data`, drive Z:); enables the shared-folder API.
        oemScript:
          type: string
          maxLength: 65536
          description: Written to <machineDir>/oem/install.bat (CRLF) and run by dockur at the end of the first install.
        jobAgent:
          type: boolean
          description: Install the Kryton guest agent via the OEM script so the jobs API works. Implies `shared`. Needs autologin (default).
        publicBind:
          type: boolean
          description: Publish RDP and the web viewer on 0.0.0.0. Default false = 127.0.0.1 only.
        rdpPort: {type: integer, minimum: 1024, maximum: 65535, description: Fixed host RDP port; 0/omitted = auto. 409 if taken by another machine or in use on the host.}
        consolePort: {type: integer, minimum: 1024, maximum: 65535, description: Fixed host web-viewer port; 0/omitted = auto.}
        command: {type: string, maxLength: 2048}
        customIso: {type: string}
        edition: {type: string}
        extraDisksGiB:
          type: array
          maxItems: 3
          items: {type: integer, minimum: 1, maximum: 65536}
    Readiness:
      type: object
      required: [machineId, ready, containerUp, rdpOpen, agentPresent, agentRequired, checks]
      properties:
        machineId: {type: string}
        ready: {type: boolean}
        containerUp: {type: boolean}
        rdpOpen: {type: boolean}
        agentPresent: {type: boolean}
        agentRequired: {type: boolean}
        install:
          type: object
          properties:
            phase: {type: string, enum: [starting, downloading, extracting, building, installing, stopped, unknown, complete]}
            percent: {type: integer}
            message: {type: string}
        checks:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              ok: {type: boolean}
              detail: {type: string}
    SharedFile:
      type: object
      properties:
        path: {type: string}
        name: {type: string}
        size: {type: integer, format: int64}
        isDir: {type: boolean}
        modTime: {type: string, format: date-time}
    GuestJobSpec:
      type: object
      additionalProperties: false
      required: [script]
      properties:
        name: {type: string, maxLength: 63}
        shell: {type: string, enum: [cmd, powershell], default: cmd}
        script: {type: string, maxLength: 65536}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 86400, default: 600}
        env:
          type: object
          maxProperties: 32
          description: Names match ^[A-Za-z_][A-Za-z0-9_]{0,63}$ and may not start with KRYTON_
          additionalProperties: {type: string, maxLength: 4096}
    GuestJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        project: {type: string}
        machineId: {type: string}
        name: {type: string}
        shell: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed, timed_out, canceled]}
        exitCode: {type: integer}
        timeoutSeconds: {type: integer}
        message: {type: string}
        submittedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        cancelRequested: {type: boolean}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/SharedFile'}
    SettingsUpdate:
      type: object
      properties:
        defaultProject: {type: string}
        imageNamespace: {type: string}
        eventWebhookUrl: {type: string}
        storageClass: {type: string}
    StorageSetup:
      type: object
      required: [backend]
      properties:
        backend: {type: string, enum: [longhorn, rook-ceph]}
        rookMode: {type: string, enum: [lab, devices, pool-only, device]}
        device: {type: string, example: /dev/sdb1}
        wipeDevice: {type: boolean}
        setDefault: {type: boolean, default: true}
    AtlasConfig:
      type: object
      properties:
        enabled: {type: boolean}
        baseUrl: {type: string, example: http://127.0.0.1:5110}
        token: {type: string}
        product: {type: string, default: kryton}
        preferAtlas: {type: boolean}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            hint: {type: string, description: Action the operator should take next}
            requestId: {type: string}
