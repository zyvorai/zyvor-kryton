{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kryton.fullname" . }}
  labels:
    {{- include "kryton.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kryton.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.metrics.tokenSecret.name }}
      # /metrics requires a bearer token unless auth is disabled or
      # metrics.public=true; scrape with the dedicated metrics token.
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.tokenSecret.name }}
          key: {{ .Values.metrics.tokenSecret.key }}
      {{- end }}
{{- end }}
