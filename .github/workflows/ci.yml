name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: License headers
        run: ./scripts/add-license-headers.sh --check
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.1"
      - name: Security scan (gosec)
        # The gosec action's container lags the go.mod toolchain; build it with setup-go's Go instead.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          CGO_ENABLED=0 go build -o /tmp/krytond ./cmd/krytond
          CGO_ENABLED=0 go build -o /tmp/krytonctl ./cmd/krytonctl

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Embedded console is up to date
        run: |
          if [ -n "$(git status --porcelain -- cmd/krytond/web)" ]; then
            git status --short -- cmd/krytond/web
            echo "cmd/krytond/web is stale: run 'make web' and commit the result."
            exit 1
          fi

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zyvorai/kryton
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/zyvorai/kryton@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
